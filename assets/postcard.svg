<svg xmlns="http://www.w3.org/2000/svg" width="880" height="215" viewBox="0 0 880 215">
  <title>Postcard from Tehran — Javad, MCP servers and APIs for the Persian web</title>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .hand{font-family:'Segoe Script','Bradley Hand','Segoe Print',cursive;font-style:italic}
    .from{font-size:12.5px;fill:#6B4E2E}
    .name{font-size:19px;fill:#4A3620;letter-spacing:.4px}
    .msg{font-size:11px;fill:#6B4E2E}
    .addr{font-size:9px;fill:#8A6E4E;letter-spacing:2.2px}
    .addrline{font-size:10.5px;fill:#6B4E2E}
    .stamp{font-size:8px;fill:#C85A3C;letter-spacing:1.5px}
    .pm{font-size:7.5px;fill:#C85A3C;letter-spacing:1.3px}
    .pmd{font-size:9px;fill:#C85A3C;letter-spacing:.6px}
    .rule{stroke:#D6C6AC;stroke-width:1}
    .fine{stroke:#E0D2BB;stroke-width:1}
  </style>

  <rect x="0" y="0" width="880" height="215" fill="#EDE4D0"/>

  <rect x="22" y="16" width="836" height="183" rx="3" fill="#F5EFE0" stroke="#D6C6AC" stroke-width="1"/>
  <rect x="29" y="23" width="822" height="169" rx="2" fill="none" stroke="#E0D2BB" stroke-width="1"/>
  <line class="rule" x1="540" y1="30" x2="540" y2="186"/>
  <line class="fine" x1="52" y1="150" x2="510" y2="150"/>

  <g>
    <path d="M676 30 h78 v78 h-78 Z M690 30 v78 M704 30 v78 M718 30 v78 M732 30 v78 M746 30 v78 M760 30 v78
             M676 44 h78 M676 58 h78 M676 72 h78 M676 86 h78 M676 100 h78
             M676 30 v78 M690 30 v78 M704 30 v78 M718 30 v78 M732 30 v78 M746 30 v78 M760 30 v78 M774 30 v78"
          fill="none" stroke="#C85A3C" stroke-width="4.5" stroke-linecap="round" opacity=".5"/>
    <rect x="681" y="35" width="68" height="68" fill="none" stroke="#C85A3C" stroke-width="1.4"/>
    <text class="stamp" x="715" y="62" text-anchor="middle">POSTE</text>
    <text class="stamp" x="715" y="78" text-anchor="middle">IRAN</text>
    <text class="pm" x="715" y="93" text-anchor="middle" fill="#6B4E2E">35.69N</text>
  </g>

  <g opacity=".85">
    <circle cx="742" cy="92" r="36" fill="none" stroke="#C85A3C" stroke-width="1.6"/>
    <circle cx="742" cy="92" r="29" fill="none" stroke="#C85A3C" stroke-width=".9"/>
    <line x1="706" y1="92" x2="778" y2="92" stroke="#C85A3C" stroke-width=".7"/>
    <text class="pm" x="742" y="78" text-anchor="middle">TEHRAN</text>
    <text class="pmd" x="742" y="104" text-anchor="middle">24 . 09 . 26</text>
    <text class="pm" x="742" y="118" text-anchor="middle">IR</text>
  </g>

  <g>
    <text class="addr" x="566" y="46">POST TO</text>
    <line class="fine" x1="566" y1="58" x2="838" y2="58"/>
    <line class="fine" x1="566" y1="78" x2="838" y2="78"/>
    <line class="fine" x1="566" y1="98" x2="838" y2="98"/>
    <line class="fine" x1="566" y1="118" x2="838" y2="118"/>
    <line class="fine" x1="566" y1="138" x2="838" y2="138"/>
    <line class="fine" x1="566" y1="158" x2="838" y2="158"/>
    <text class="addrline hand" x="572" y="54">The Persian Web</text>
    <text class="addrline hand" x="572" y="74">c / o Digikala · Divar</text>
    <text class="addrline hand" x="572" y="94">Tehran</text>
    <text class="addrline hand" x="572" y="114">35.6892 N</text>
    <text class="addrline hand" x="572" y="134">51.3890 E</text>
    <text class="addrline hand" x="572" y="154">IRAN</text>
  </g>

  <g>
    <text class="addr" x="52" y="46">FROM</text>
    <line class="fine" x1="52" y1="58" x2="420" y2="58"/>
    <text class="hand name" x="56" y="82">Javad</text>
    <text class="hand msg" x="56" y="102">MCP servers &amp; APIs for the Persian web</text>
    <text class="hand msg" x="56" y="118">Read-only. No keys. No scraping your login.</text>
    <text class="hand msg" x="56" y="140">202 stars, 9 repos, all on Workers.</text>
  </g>

  <text class="addr" x="52" y="170">CARTE POSTALE · AIR MAIL · mmdju</text>
  <text class="addr" x="470" y="170" text-anchor="end">Greetings from 35.69°N 51.39°E</text>
