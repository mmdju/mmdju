<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080F"/>
      <stop offset="50%" stop-color="#0B0D1A"/>
      <stop offset="100%" stop-color="#06070D"/>
    </linearGradient>

    <radialGradient id="aur1">
      <stop offset="0%" stop-color="#4F7BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4F7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur3">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur4">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C7D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F7BFF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.022"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="row1"><rect x="0" y="0" width="800" height="138"/></clipPath>
  </defs>

  <style>
    .sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SF Mono',ui-monospace,'Cascadia Code','Roboto Mono',Menlo,Consolas,monospace}

    @keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,44px) scale(1.12)}}
    @keyframes d2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-58px,66px) scale(1)}}
    @keyframes d3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(46px,-58px) scale(1.16)}}
    @keyframes d4{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-40px,-30px) scale(1)}}

    @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes glowpulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
    @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes drawdash{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}

    .a1{animation:d1 19s ease-in-out infinite}
    .a2{animation:d2 23s ease-in-out infinite}
    .a3{animation:d3 17s ease-in-out infinite}
    .a4{animation:d4 29s ease-in-out infinite}
    .shimmer{animation:slide 5.5s ease-in-out infinite}

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
    }
  </style>

  <!-- ===== base ===== -->
  <rect width="800" height="1100" fill="url(#bg)"/>

  <!-- ===== aurora field ===== -->
  <g filter="url(#soft)">
    <circle class="a1" cx="150" cy="120" r="230" fill="url(#aur1)"/>
    <circle class="a2" cx="660" cy="230" r="210" fill="url(#aur2)"/>
    <circle class="a3" cx="120" cy="640" r="250" fill="url(#aur3)"/>
    <circle class="a4" cx="700" cy="820" r="230" fill="url(#aur4)"/>
  </g>

  <!-- faint dot grid -->
  <g fill="#FFFFFF" opacity="0.05">
    <circle cx="48" cy="290" r="1"/><circle cx="128" cy="290" r="1"/><circle cx="208" cy="290" r="1"/>
    <circle cx="288" cy="290" r="1"/><circle cx="368" cy="290" r="1"/><circle cx="448" cy="290" r="1"/>
    <circle cx="528" cy="290" r="1"/><circle cx="608" cy="290" r="1"/><circle cx="688" cy="290" r="1"/>
    <circle cx="768" cy="290" r="1"/>
  </g>

  <!-- ===== grain ===== -->
  <rect width="800" height="1100" filter="url(#grain)" opacity="0.028"/>

  <!-- ===== top bar + shimmer ===== -->
  <g clip-path="url(#row1)">
    <rect width="800" height="3" fill="url(#topBar)"/>
    <rect class="shimmer" x="0" y="0" width="180" height="3" fill="url(#sweep)"/>
  </g>

  <!-- ===== hero ===== -->
  <g class="sans">
    <text x="48" y="82" font-size="11" letter-spacing="4.2" fill="#7C8AA8" style="animation:fade .3s both">READ-ONLY MCP SERVERS &amp; APIs</text>

    <text x="48" y="182" font-size="78" font-weight="800" letter-spacing="-3" fill="url(#nameGrad)" filter="url(#glow)" style="animation:rise .3s both">JAVAD</text>

    <text x="48" y="216" font-size="15" fill="#A9B6D0" style="animation:rise .3s both">Tehran, Iran &#183; Digikala &#183; Divar &#183; IMDb &#183; Letterboxd</text>
    <text x="48" y="242" font-size="13" fill="#6E7C96" style="animation:rise .3s both">Everything on Cloudflare Workers. Nothing writes, no key required.</text>
  </g>

  <line x1="48" y1="272" x2="752" y2="272" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- ===== section label ===== -->
  <g class="sans">
    <text x="48" y="308" font-size="11" letter-spacing="3.4" fill="#7C8AA8" style="animation:fade .3s both">PROJECTS</text>
    <text x="752" y="308" text-anchor="end" font-size="11" letter-spacing="2" fill="#4E5A73" style="animation:fade .3s both">8 PUBLIC</text>
  </g>

  <!-- ===== cards ===== -->
  <g class="sans">

    <!-- 01 digikala -->
    <g style="animation:rise .3s both">
      <rect x="48" y="330" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="48" y="346" width="3" height="90" rx="1.5" fill="#FF6B35"/>
      <text x="70" y="366" font-size="16" font-weight="600" fill="#F2F5FF">digikala-mcp</text>
      <text x="70" y="390" font-size="11.5" fill="#93A0BC">Search, compare and price-check Iran&#8217;s</text>
      <text x="70" y="406" font-size="11.5" fill="#93A0BC">biggest marketplace. 16 tools.</text>
      <text x="70" y="432" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">16 TOOLS &#183; LIVE</text>
      <text x="368" y="368" text-anchor="end" font-size="22" font-weight="700" fill="#FF8A5C">113&#9733;</text>
      <rect x="268" y="378" width="100" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="268" y="378" width="100" height="6" rx="3" fill="#FF6B35" style="transform-box:fill-box;transform-origin:left center;animation:grow .4s both"/>
    </g>

    <!-- 02 divar -->
    <g style="animation:rise .3s both">
      <rect x="410" y="330" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="410" y="346" width="3" height="90" rx="1.5" fill="#2E8B9E"/>
      <text x="432" y="366" font-size="16" font-weight="600" fill="#F2F5FF">divar-mcp</text>
      <text x="432" y="390" font-size="11.5" fill="#93A0BC">Classifieds intelligence. Toman prices,</text>
      <text x="432" y="406" font-size="11.5" fill="#93A0BC">market medians, honest verdicts.</text>
      <text x="432" y="432" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">7 TOOLS &#183; LIVE</text>
      <text x="730" y="368" text-anchor="end" font-size="22" font-weight="700" fill="#4FC3D9">58&#9733;</text>
      <rect x="658" y="378" width="72" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="658" y="378" width="72" height="6" rx="3" fill="#2E8B9E" style="transform-box:fill-box;transform-origin:left center;animation:grow 1s 1s both"/>
    </g>

    <!-- 03 orca-mcp -->
    <g style="animation:rise .3s both">
      <rect x="48" y="470" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="48" y="486" width="3" height="90" rx="1.5" fill="#7C6BFF"/>
      <text x="70" y="506" font-size="16" font-weight="600" fill="#F2F5FF">orca-mcp</text>
      <text x="70" y="530" font-size="11.5" fill="#93A0BC">Movies and TV across TMDB, IMDb,</text>
      <text x="70" y="546" font-size="11.5" fill="#93A0BC">Letterboxd, RT/MC, streaming.</text>
      <text x="70" y="572" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">21 TOOLS &#183; LIVE</text>
      <text x="368" y="508" text-anchor="end" font-size="22" font-weight="700" fill="#A99BFF">6&#9733;</text>
      <rect x="345" y="518" width="23" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="345" y="518" width="23" height="6" rx="3" fill="#7C6BFF" style="transform-box:fill-box;transform-origin:left center;animation:grow .4s both"/>
    </g>

    <!-- 04 orca-movies -->
    <g style="animation:rise .3s both">
      <rect x="410" y="470" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="410" y="486" width="3" height="90" rx="1.5" fill="#29B6F6"/>
      <text x="432" y="506" font-size="16" font-weight="600" fill="#F2F5FF">orca-movies</text>
      <text x="432" y="530" font-size="11.5" fill="#93A0BC">Bilingual Telegram assistant for</text>
      <text x="432" y="546" font-size="11.5" fill="#93A0BC">deciding what to watch. Persian first.</text>
      <text x="432" y="572" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">BOT &#183; OPEN</text>
      <text x="730" y="508" text-anchor="end" font-size="22" font-weight="700" fill="#6FD0FA">6&#9733;</text>
      <rect x="707" y="518" width="23" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="707" y="518" width="23" height="6" rx="3" fill="#29B6F6" style="transform-box:fill-box;transform-origin:left center;animation:grow .4s both"/>
    </g>

    <!-- 05 orca-save -->
    <g style="animation:rise .3s both">
      <rect x="48" y="610" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="48" y="626" width="3" height="90" rx="1.5" fill="#4DB6AC"/>
      <text x="70" y="646" font-size="16" font-weight="600" fill="#F2F5FF">orca-save</text>
      <text x="70" y="670" font-size="11.5" fill="#93A0BC">Media downloader. Link from 8 platforms</text>
      <text x="70" y="686" font-size="11.5" fill="#93A0BC">in, file back in chat.</text>
      <text x="70" y="712" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">BOT &#183; OPEN</text>
      <text x="368" y="648" text-anchor="end" font-size="22" font-weight="700" fill="#6FD4CB">5&#9733;</text>
      <rect x="347" y="658" width="21" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="347" y="658" width="21" height="6" rx="3" fill="#4DB6AC" style="transform-box:fill-box;transform-origin:left center;animation:grow .4s both"/>
    </g>

    <!-- 06 fa-text-utils -->
    <g style="animation:rise .3s both">
      <rect x="410" y="610" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="410" y="626" width="3" height="90" rx="1.5" fill="#FFB74D"/>
      <text x="432" y="646" font-size="16" font-weight="600" fill="#F2F5FF">fa-text-utils</text>
      <text x="432" y="670" font-size="11.5" fill="#93A0BC">Persian text folding so search works</text>
      <text x="432" y="686" font-size="11.5" fill="#93A0BC">the way people actually type.</text>
      <text x="432" y="712" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">ZERO DEPS</text>
      <text x="730" y="648" text-anchor="end" font-size="22" font-weight="700" fill="#FFCB80">5&#9733;</text>
      <rect x="709" y="658" width="21" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="709" y="658" width="21" height="6" rx="3" fill="#FFB74D" style="transform-box:fill-box;transform-origin:left center;animation:grow .4s both"/>
    </g>

    <!-- 07 imdb -->
    <g style="animation:rise .3s both">
      <rect x="48" y="750" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="48" y="766" width="3" height="90" rx="1.5" fill="#F5C518"/>
      <text x="70" y="786" font-size="16" font-weight="600" fill="#F2F5FF">imdb-top250-api</text>
      <text x="70" y="810" font-size="11.5" fill="#93A0BC">IMDb Top 250 as clean JSON. No key,</text>
      <text x="70" y="826" font-size="11.5" fill="#93A0BC">no scraping, no rate-limit games.</text>
      <text x="70" y="852" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">JSON API &#183; LIVE</text>
      <text x="368" y="788" text-anchor="end" font-size="22" font-weight="700" fill="#F5C518">4&#9733;</text>
      <rect x="349" y="798" width="19" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="349" y="798" width="19" height="6" rx="3" fill="#F5C518" style="transform-box:fill-box;transform-origin:left center;animation:grow .4s both"/>
    </g>

    <!-- 08 letterboxd -->
    <g style="animation:rise .3s both">
      <rect x="410" y="750" width="342" height="122" rx="14" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1"/>
      <rect x="410" y="766" width="3" height="90" rx="1.5" fill="#00E054"/>
      <text x="432" y="786" font-size="16" font-weight="600" fill="#F2F5FF">letterboxd-top500-api</text>
      <text x="432" y="810" font-size="11.5" fill="#93A0BC">Letterboxd Top 500 as clean JSON.</text>
      <text x="432" y="826" font-size="11.5" fill="#93A0BC">Same shape as the IMDb one.</text>
      <text x="432" y="852" class="mono" font-size="10" letter-spacing="1" fill="#5E6B85">JSON API &#183; LIVE</text>
      <text x="730" y="788" text-anchor="end" font-size="22" font-weight="700" fill="#00E054">4&#9733;</text>
      <rect x="711" y="798" width="19" height="6" rx="3" fill="#FFFFFF" opacity="0.08"/>
      <rect x="711" y="798" width="19" height="6" rx="3" fill="#00E054" style="transform-box:fill-box;transform-origin:left center;animation:grow .4s both"/>
    </g>
  </g>

  <!-- ===== stats ===== -->
  <line x1="48" y1="908" x2="752" y2="908" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <g class="sans" style="animation:fade .3s both">
    <text x="48" y="944" font-size="11" letter-spacing="3.4" fill="#7C8AA8">AT A GLANCE</text>

    <text x="48" y="1002" font-size="40" font-weight="700" fill="#F2F5FF">180</text>
    <text x="48" y="1024" class="mono" font-size="10" letter-spacing="1.6" fill="#5E6B85">STARS</text>

    <text x="200" y="1002" font-size="40" font-weight="700" fill="#F2F5FF">9</text>
    <text x="200" y="1024" class="mono" font-size="10" letter-spacing="1.6" fill="#5E6B85">REPOS</text>

    <text x="330" y="1002" font-size="40" font-weight="700" fill="#F2F5FF">38</text>
    <text x="330" y="1024" class="mono" font-size="10" letter-spacing="1.6" fill="#5E6B85">FOLLOWERS</text>

    <text x="500" y="1002" font-size="40" font-weight="700" fill="#F2F5FF">18</text>
    <text x="500" y="1024" class="mono" font-size="10" letter-spacing="1.6" fill="#5E6B85">FORKS</text>

    <text x="628" y="1002" font-size="40" font-weight="700" fill="#F2F5FF">44</text>
    <text x="628" y="1024" class="mono" font-size="10" letter-spacing="1.6" fill="#5E6B85">TOOLS</text>
  </g>

  <!-- live dot -->
  <g style="animation:fade .3s both">
    <circle cx="48" cy="1060" r="4" fill="#22C55E" style="animation:glowpulse 2.4s ease-in-out infinite"/>
    <text x="62" y="1064" class="sans" font-size="11" letter-spacing="1.8" fill="#4E5A73">ALL SYSTEMS READ-ONLY &#183; NO API KEY REQUIRED</text>
    <text x="752" y="1064" text-anchor="end" class="mono" font-size="11" letter-spacing="1.2" fill="#4E5A73">github.com/mmdju</text>
  </g>
</svg>
