<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Green screen terminal readout: three MCP servers live, three JSON APIs live, two Telegram bots alive, nine public repos, 202 stars, 36 followers, 18 forks, 254 contributions, read-only with no API keys.">
  <defs>
    <filter id="phos" x="-15%" y="-40%" width="130%" height="190%">
      <feGaussianBlur stdDeviation="2.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="crtLines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" fill-opacity="0.32"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#00FF41" stop-opacity="0.035"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="880" height="200" fill="#000000"/>

  <rect x="58" y="10" width="764" height="180" rx="16" fill="#0B0B0B" stroke="#1C1C1C" stroke-width="1.5"/>
  <rect x="66" y="17" width="748" height="164" rx="11" fill="#050505" stroke="#121212" stroke-width="1"/>
  <rect x="78" y="26" width="724" height="152" rx="6" fill="#000000" stroke="#0A2A10" stroke-width="1"/>

  <g font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" filter="url(#phos)">
    <text x="96" y="48"><tspan fill="#FFFFFF">JAVAD</tspan><tspan fill="#00CC33">@NIGHTSHIFT</tspan><tspan fill="#FFFFFF">:~$</tspan><tspan fill="#00FF41"> ./profile --status</tspan></text>

    <text x="96" y="76" fill="#00CC33">servers<tspan fill="#00FF41">  3 mcp + 3 api live</tspan><tspan fill="#007A1F">   all on cloudflare workers</tspan></text>
    <text x="96" y="92" fill="#00CC33">bots   <tspan fill="#00FF41">  2 alive</tspan><tspan fill="#007A1F">      orca-movies 6*  orca-save 5*</tspan></text>
    <text x="96" y="108" fill="#00CC33">mcp    <tspan fill="#00FF41">  44 tools</tspan><tspan fill="#007A1F">       digikala 16  divar 7  orca 21</tspan></text>
    <text x="96" y="124" fill="#00CC33">access <tspan fill="#00FF41">  read-only</tspan><tspan fill="#007A1F">       no api key required, ever</tspan></text>
    <text x="96" y="140" fill="#00CC33">registry<tspan fill="#00FF41"> 9 repos</tspan><tspan fill="#007A1F">    202 stars  36 followers  18 forks  254 contrib</tspan></text>
  </g>

  <rect x="96" y="57" width="688" height="1" fill="#007A1F"/>
  <rect x="96" y="150" width="688" height="1" fill="#007A1F"/>

  <rect x="252" y="156" width="9" height="15" fill="#00FF41" filter="url(#phos)">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="78" y="26" width="724" height="152" rx="6" fill="url(#crtLines)"/>
  <rect x="78" y="26" width="724" height="152" rx="6" fill="url(#vignette)"/>

  <circle cx="440" cy="185" r="2.6" fill="#00FF41" opacity="0.75"/>
</svg>
