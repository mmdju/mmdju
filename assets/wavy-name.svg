<svg xmlns="http://www.w3.org/2000/svg" width="520" height="96" viewBox="0 0 520 96">
  <style>
    .n{font-family:'SF Pro Text','Segoe UI',Ubuntu,sans-serif;font-size:42px;font-weight:800;letter-spacing:-1px}
    @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
    @keyframes drop{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(3px);opacity:1}}
    .grad{background:linear-gradient(100deg,#0A84FF 0%,#5AC8FA 25%,#F5F5F7 50%,#5AC8FA 75%,#0A84FF 100%);
          background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
          animation:shimmer 5s linear infinite}
    .d{animation:drop 1.9s ease-in-out infinite}
  </style>

  <text class="n" x="20" y="52">
    <tspan fill="#F5F5F7">Hi, I'm </tspan><tspan class="grad">Javad</tspan>
  </text>

  <g>
    <rect class="d" x="24"  y="70" width="7" height="7" rx="1.5" fill="#0A84FF" opacity=".2"/>
    <rect class="d" x="36"  y="70" width="7" height="7" rx="1.5" fill="#0A84FF" opacity=".3" style="animation-delay:.12s"/>
    <rect class="d" x="48"  y="70" width="7" height="7" rx="1.5" fill="#0A84FF" opacity=".5" style="animation-delay:.24s"/>
    <rect class="d" x="60"  y="70" width="7" height="7" rx="1.5" fill="#0A84FF" opacity=".8" style="animation-delay:.36s"/>
    <rect class="d" x="72"  y="70" width="7" height="7" rx="1.5" fill="#64D2FF"         style="animation-delay:.48s"/>
  </g>

  <text x="92" y="78" font-family="'SF Pro Text','Segoe UI',Ubuntu,sans-serif" font-size="12" fill="#636366">
    MCP servers for the Persian web
  </text>
</svg>
