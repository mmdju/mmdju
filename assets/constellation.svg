<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="A night-sky star map in which four labelled stars are joined by faint lines into a constellation.">
  <title>Javad — constellation of projects</title>
  <style>
    .mono { font-family: 'SF Mono', 'Cascadia Mono', Consolas, 'Ubuntu Mono', 'DejaVu Sans Mono', monospace; }

    /* four twinkle rhythms, staggered so the sky never pulses in unison */
    @keyframes tw1 { 0%,100% { opacity: 1; } 50% { opacity: 0.32; } }
    @keyframes tw2 { 0%,100% { opacity: 1; } 50% { opacity: 0.28; } }
    @keyframes tw3 { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes tw4 { 0%,100% { opacity: 1; } 50% { opacity: 0.36; } }

    .a1 { animation: tw1 3.1s ease-in-out infinite; animation-delay: -0.4s; }
    .a2 { animation: tw2 4.7s ease-in-out infinite; animation-delay: -1.9s; }
    .a3 { animation: tw3 2.6s ease-in-out infinite; animation-delay: -1.1s; }
    .a4 { animation: tw4 5.9s ease-in-out infinite; animation-delay: -3.3s; }

    .s1 { animation: tw1 4.3s ease-in-out infinite; animation-delay: -2.2s; }
    .s2 { animation: tw2 3.6s ease-in-out infinite; animation-delay: -0.8s; }
    .s3 { animation: tw3 5.2s ease-in-out infinite; animation-delay: -3.7s; }
    .s4 { animation: tw4 2.9s ease-in-out infinite; animation-delay: -1.5s; }

    /* the four named stars, each on its own rhythm */
    .h1 { animation: tw1 5.2s ease-in-out infinite; animation-delay: -0.8s; }
    .h2 { animation: tw2 4.4s ease-in-out infinite; animation-delay: -2.4s; }
    .h3 { animation: tw3 6.1s ease-in-out infinite; animation-delay: -1.5s; }
    .h4 { animation: tw4 3.8s ease-in-out infinite; animation-delay: -3.6s; }
  </style>

  <!-- opaque background: identical in light and dark GitHub themes -->
  <rect width="900" height="210" fill="#020617"/>

  <defs>
    <radialGradient id="horizon" cx="50%" cy="104%" r="78%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="210" fill="url(#horizon)"/>

  <!-- scattered field -->
  <g fill="#E0E7FF">
    <circle class="a1" cx="34"  cy="28"  r="1"   opacity=".55"/>
    <circle class="s2" cx="70"  cy="180" r="1.3" opacity=".45"/>
    <circle class="a3" cx="108" cy="20"  r=".8"  opacity=".72"/>
    <circle class="s4" cx="122" cy="130" r="1"   opacity=".40"/>
    <circle class="a2" cx="188" cy="190" r="1.1" opacity=".48"/>
    <circle class="s1" cx="228" cy="94"  r=".9"  opacity=".60"/>
    <circle class="a4" cx="262" cy="14"  r="1.2" opacity=".38"/>
    <circle class="s3" cx="296" cy="60"  r=".7"  opacity=".74"/>
    <circle class="a1" cx="340" cy="198" r="1"   opacity=".46"/>
    <circle class="s2" cx="348" cy="38"  r=".8"  opacity=".64"/>
    <circle class="s4" cx="430" cy="104" r="1.2" opacity=".34"/>
    <circle class="a3" cx="450" cy="24"  r=".9"  opacity=".62"/>
    <circle class="s1" cx="498" cy="182" r="1"   opacity=".44"/>
    <circle class="a2" cx="524" cy="70"  r=".7"  opacity=".70"/>
    <circle class="s3" cx="560" cy="148" r="1.1" opacity=".40"/>
    <circle class="a4" cx="642" cy="16"  r=".8"  opacity=".68"/>
    <circle class="s4" cx="666" cy="120" r="1.2" opacity=".34"/>
    <circle class="a1" cx="702" cy="186" r=".9"  opacity=".54"/>
    <circle class="s3" cx="734" cy="64"  r=".7"  opacity=".66"/>
    <circle class="a2" cx="770" cy="22"  r="1.1" opacity=".42"/>
    <circle class="s1" cx="802" cy="90"  r=".8"  opacity=".60"/>
    <circle class="a4" cx="844" cy="170" r="1"   opacity=".46"/>
    <circle class="s2" cx="876" cy="42"  r="1.2" opacity=".38"/>
    <circle class="s4" cx="886" cy="120" r=".7"  opacity=".70"/>
    <circle class="a3" cx="22"  cy="90"  r=".8"  opacity=".50"/>
    <circle class="s4" cx="404" cy="6"   r=".9"  opacity=".52"/>
    <circle class="a1" cx="556" cy="204" r="1"   opacity=".36"/>
    <circle class="s2" cx="196" cy="66"  r="1"   opacity=".44"/>
    <circle class="s3" cx="486" cy="132" r=".8"  opacity=".58"/>
  </g>

  <!-- constellation lines -->
  <g stroke="#60A5FA" fill="none">
    <path d="M160 62 L382 142 L602 52 L826 138" stroke-width="1" opacity=".30"/>
    <path d="M160 62 L602 52" stroke-width="1" opacity=".16" stroke-dasharray="3 5"/>
    <path d="M382 142 L826 138" stroke-width="1" opacity=".16" stroke-dasharray="3 5"/>
  </g>

  <!-- unnamed waypoint stars sitting on the lines -->
  <g fill="#60A5FA">
    <circle class="s1" cx="246" cy="112" r="1.8" opacity=".7"/>
    <circle class="a3" cx="490" cy="96"  r="1.5" opacity=".55"/>
    <circle class="s4" cx="712" cy="92"  r="1.8" opacity=".7"/>
  </g>

  <!-- digikala-mcp : 112 -->
  <g>
    <g class="h1">
      <circle cx="160" cy="62" r="28" fill="#60A5FA" opacity=".05"/>
      <circle cx="160" cy="62" r="17" fill="#60A5FA" opacity=".09"/>
      <circle cx="160" cy="62" r="9.5" fill="#60A5FA" opacity=".16"/>
      <circle cx="160" cy="62" r="4.8" fill="#DBEAFE"/>
      <circle cx="160" cy="62" r="2"   fill="#FFFFFF"/>
    </g>
    <text x="160" y="30" class="mono" font-size="12.5" letter-spacing="1.2" fill="#E0E7FF" text-anchor="middle">digikala-mcp</text>
    <text x="160" y="43" class="mono" font-size="9"   letter-spacing="1.6" fill="#93C5FD" text-anchor="middle">112 STARS</text>
  </g>

  <!-- divar-mcp : 57 -->
  <g>
    <g class="h2">
      <circle cx="382" cy="142" r="23" fill="#60A5FA" opacity=".05"/>
      <circle cx="382" cy="142" r="14" fill="#60A5FA" opacity=".09"/>
      <circle cx="382" cy="142" r="8"   fill="#60A5FA" opacity=".16"/>
      <circle cx="382" cy="142" r="4.2" fill="#DBEAFE"/>
      <circle cx="382" cy="142" r="1.9" fill="#FFFFFF"/>
    </g>
    <text x="382" y="172" class="mono" font-size="12.5" letter-spacing="1.2" fill="#E0E7FF" text-anchor="middle">divar-mcp</text>
    <text x="382" y="185" class="mono" font-size="9"   letter-spacing="1.6" fill="#93C5FD" text-anchor="middle">57 STARS</text>
  </g>

  <!-- orca-mcp : 6 -->
  <g>
    <g class="h3">
      <circle cx="602" cy="52" r="21" fill="#60A5FA" opacity=".05"/>
      <circle cx="602" cy="52" r="13" fill="#60A5FA" opacity=".09"/>
      <circle cx="602" cy="52" r="7.5" fill="#60A5FA" opacity=".16"/>
      <circle cx="602" cy="52" r="4"   fill="#DBEAFE"/>
      <circle cx="602" cy="52" r="1.8" fill="#FFFFFF"/>
    </g>
    <text x="602" y="20" class="mono" font-size="12.5" letter-spacing="1.2" fill="#E0E7FF" text-anchor="middle">orca-mcp</text>
    <text x="602" y="33" class="mono" font-size="9"   letter-spacing="1.6" fill="#93C5FD" text-anchor="middle">6 STARS</text>
  </g>

  <!-- orca-movies : 6, the warm one -->
  <g>
    <g class="h4">
      <circle cx="826" cy="138" r="21" fill="#FDE68A" opacity=".06"/>
      <circle cx="826" cy="138" r="13" fill="#FDE68A" opacity=".11"/>
      <circle cx="826" cy="138" r="7.5" fill="#FDE68A" opacity=".19"/>
      <circle cx="826" cy="138" r="4"   fill="#FEF3C7"/>
      <circle cx="826" cy="138" r="1.8" fill="#FFFFFF"/>
    </g>
    <text x="826" y="168" class="mono" font-size="12.5" letter-spacing="1.2" fill="#FDE68A" text-anchor="end">orca-movies</text>
    <text x="826" y="181" class="mono" font-size="9"   letter-spacing="1.6" fill="#FCD34D" text-anchor="end">6 STARS</text>
  </g>

  <text x="22" y="198" class="mono" font-size="8.5" letter-spacing="1.7" fill="#64748B">TEHRAN / IR — READ-ONLY MCP SERVERS + APIS</text>
</svg>
