<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120">
  <style>
    text{font-family:'SF Pro Text','Segoe UI',Ubuntu,sans-serif}
    @keyframes flow { to { stroke-dashoffset: -60; } }
    .wire{fill:none;stroke:#0A84FF;stroke-width:1.5;stroke-dasharray:5 5;opacity:.55;animation:flow 2.4s linear infinite}
    .node{fill:#0A0A0F;stroke:#0A84FF;stroke-width:1.5}
    .lbl{font-size:10.5px;fill:#F5F5F7;font-weight:600}
    .sub{font-size:8.5px;fill:#636366}
  </style>

  <rect x="0.5" y="0.5" width="879" height="119" rx="12" fill="#0A0A0F" stroke="#38383A"/>

  <path class="wire" d="M96 60 H 236"/>
  <path class="wire" d="M300 60 H 440"/>
  <path class="wire" d="M504 60 H 644"/>

  <rect class="node" x="30" y="38" width="66" height="44" rx="9"/>
  <text class="lbl" x="63" y="58" text-anchor="middle">agent</text>
  <text class="sub" x="63" y="71" text-anchor="middle">claude</text>

  <rect class="node" x="236" y="30" width="64" height="60" rx="9" stroke="#64D2FF" stroke-width="2"/>
  <circle cx="268" cy="48" r="3.5" fill="#64D2FF"/>
  <text class="lbl" x="268" y="66" text-anchor="middle">worker</text>
  <text class="sub" x="268" y="79" text-anchor="middle">read-only</text>

  <rect class="node" x="440" y="38" width="64" height="44" rx="9"/>
  <text class="lbl" x="472" y="58" text-anchor="middle">upstream</text>
  <text class="sub" x="472" y="71" text-anchor="middle">no key</text>

  <rect class="node" x="644" y="38" width="66" height="44" rx="9" stroke="#28C840" stroke-width="1.5"/>
  <text class="lbl" x="677" y="58" text-anchor="middle">json</text>
  <text class="sub" x="677" y="71" text-anchor="middle">toman</text>

  <text x="30" y="20" font-size="11" fill="#636366">how every one of my servers works</text>
  <text x="850" y="20" font-size="11" fill="#48484A" text-anchor="end">mmdju</text>
  <text x="850" y="104" font-size="9" fill="#48484A" text-anchor="end">no login · no scraping · no keys</text>
</svg>
