<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="Status board: 202 stars, 9 public repos, 36 followers, 18 forks, 44 tools across three live MCP servers, 254 contributions.">
  <defs>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1219"/>
      <stop offset="1" stop-color="#070A0E"/>
    </linearGradient>
    <pattern id="gridTex" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="scanTex" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="880" height="210" fill="#05070A"/>
  <rect width="880" height="210" fill="url(#gridTex)"/>

  <circle cx="24" cy="21" r="3.5" fill="#00E5A0">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="35" y="25" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="2.6" fill="#94A3B8">STATUS BOARD</text>
  <text x="856" y="25" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" letter-spacing="1.3" fill="#94A3B8" opacity="0.75">TEHRAN, IR &#183; SEP 2026</text>
  <rect x="20" y="33" width="840" height="1" fill="#94A3B8" fill-opacity="0.18"/>

  <g>
    <rect x="20" y="42" width="160" height="104" rx="8" fill="url(#tileFill)" stroke="#1B2430" stroke-width="1"/>
    <text x="32" y="62" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#94A3B8">STARS</text>
    <text x="32" y="96" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="600" fill="#22D3EE">202</text>
    <polyline points="32,130 49,126 66,128 83,122 100,124 117,116 134,119 151,110 168,112" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="168" cy="112" r="2.2" fill="#22D3EE"/>
  </g>
  <g>
    <rect x="190" y="42" width="160" height="104" rx="8" fill="url(#tileFill)" stroke="#1B2430" stroke-width="1"/>
    <text x="202" y="62" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#94A3B8">PUBLIC REPOS</text>
    <text x="202" y="96" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="600" fill="#00E5A0">9</text>
    <polyline points="202,118 219,118 236,118 253,116 270,116 287,112 304,112 321,110 338,110" fill="none" stroke="#00E5A0" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="338" cy="110" r="2.2" fill="#00E5A0"/>
  </g>
  <g>
    <rect x="360" y="42" width="160" height="104" rx="8" fill="url(#tileFill)" stroke="#1B2430" stroke-width="1"/>
    <text x="372" y="62" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#94A3B8">MCP TOOLS</text>
    <text x="372" y="96" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="600" fill="#00E5A0">44</text>
    <polyline points="372,126 389,126 406,124 423,122 440,118 457,114 474,110 491,108 508,106" fill="none" stroke="#00E5A0" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="508" cy="106" r="2.2" fill="#00E5A0"/>
  </g>
  <g>
    <rect x="530" y="42" width="160" height="104" rx="8" fill="url(#tileFill)" stroke="#1B2430" stroke-width="1"/>
    <text x="542" y="62" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#94A3B8">FOLLOWERS</text>
    <text x="542" y="96" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="600" fill="#22D3EE">36</text>
    <polyline points="542,124 559,122 576,124 593,120 610,120 627,116 644,118 661,112 678,114" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="678" cy="114" r="2.2" fill="#22D3EE"/>
  </g>
  <g>
    <rect x="700" y="42" width="160" height="104" rx="8" fill="url(#tileFill)" stroke="#1B2430" stroke-width="1"/>
    <text x="712" y="62" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#94A3B8">CONTRIBUTIONS</text>
    <text x="712" y="96" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="600" fill="#00E5A0">254</text>
    <polyline points="712,128 729,126 746,128 763,124 780,125 797,120 814,122 831,118 848,119" fill="none" stroke="#00E5A0" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="848" cy="119" r="2.2" fill="#00E5A0"/>
  </g>

  <text x="20" y="176" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="1.8" fill="#94A3B8" opacity="0.85">DEPLOYED</text>

  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" letter-spacing="0.8" fill="#CBD5E1">
    <circle cx="100" cy="172" r="4" fill="#00E5A0">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="112" y="176">MCP 3/3</text>

    <circle cx="216" cy="172" r="4" fill="#00E5A0">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="228" y="176">API 3/3</text>

    <circle cx="324" cy="172" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="336" y="176">BOTS 2/2</text>

    <circle cx="432" cy="172" r="4" fill="#00E5A0">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="444" y="176">READ-ONLY</text>

    <circle cx="548" cy="172" r="4" fill="#00E5A0">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="560" y="176">NO API KEYS</text>
  </g>

  <text x="856" y="176" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="1.5" fill="#00E5A0" opacity="0.9">OPEN TO WORK</text>

  <rect width="880" height="210" fill="url(#scanTex)"/>
  <rect x="0" y="207" width="880" height="3" fill="#00E5A0" fill-opacity="0.32"/>
</svg>
