<svg xmlns="http://www.w3.org/2000/svg" width="830" height="140" viewBox="0 0 830 140">
  <style>
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 2px #0A84FF); } 50% { filter: drop-shadow(0 0 7px #0A84FF); } }
    .track { fill: none; stroke: #1C1C1E; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .snake { fill: none; stroke: #0A84FF; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 5s ease-out forwards; }
    .head  { fill: #64D2FF; animation: glow 1.6s ease-in-out infinite; }
  </style>

  <rect x="0.5" y="0.5" width="829" height="139" rx="12" fill="#0A0A0F" stroke="#38383A"/>
  <circle cx="28" cy="30" r="4" fill="#0A84FF"/>
  <text x="40" y="36" font-family="'SF Pro Text','Segoe UI',Ubuntu,sans-serif" font-size="15" font-weight="600" fill="#F5F5F7">Contribution snake</text>
  <text x="802" y="36" font-family="'SF Pro Text','Segoe UI',Ubuntu,sans-serif" font-size="11.5" fill="#636366" text-anchor="end">mmdju</text>
  <line x1="20" y1="50" x2="810" y2="50" stroke="#1C1C1E"/>

  <path class="track" d="M40 84
    C 90 84 90 100 140 100 S 190 84 240 84 S 290 100 340 100 S 390 84 440 84
    S 490 100 540 100 S 590 84 640 84 S 690 100 740 100 S 770 92 800 84"/>

  <path class="snake" d="M40 84
    C 90 84 90 100 140 100 S 190 84 240 84 S 290 100 340 100 S 390 84 440 84
    S 490 100 540 100 S 590 84 640 84 S 690 100 740 100 S 770 92 800 84"/>
  <circle class="head" cx="800" cy="84" r="6"/>
</svg>
